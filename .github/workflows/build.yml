name: Build DEWZX VOICE AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Install required libraries
        run: |
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "ArduinoJson@6.21.4"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=default,FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,CPUFreq=240,DebugLevel=none" \
            --output-dir ./build \
            --warnings default \
            DEWZX_VOICE_AI/

      - name: Generate merged binary (5MB+)
        run: |
          pip install esptool --quiet

          cp build/DEWZX_VOICE_AI.ino.bootloader.bin build/bootloader.bin
          cp build/DEWZX_VOICE_AI.ino.partitions.bin build/partitions.bin
          cp build/DEWZX_VOICE_AI.ino.bin            build/firmware.bin

          # Merge jadi 1 file, flash ke 0x0
          esptool.py --chip esp32s3 merge_bin \
            -o build/DEWZX_merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0     build/bootloader.bin \
            0x8000  build/partitions.bin \
            0x10000 build/firmware.bin

          # Pad sampai minimal 5MB dengan 0xFF (nilai flash kosong)
          python3 - << 'PY'
          import os
          path = "build/DEWZX_merged.bin"
          target = 5 * 1024 * 1024
          size = os.path.getsize(path)
          if size < target:
              with open(path, "ab") as f:
                  f.write(b"\xff" * (target - size))
          print(f"DEWZX_merged.bin final size: {os.path.getsize(path):,} bytes")
          PY

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEWZX-firmware
          path: |
            build/DEWZX_merged.bin
            build/bootloader.bin
            build/partitions.bin
            build/firmware.bin
          retention-days: 30

