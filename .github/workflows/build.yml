name: Build DEWZX VOICE AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Install required libraries
        run: |
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "ArduinoJson@6.21.4"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,CPUFreq=240,DebugLevel=none" \
            --output-dir ./build \
            --warnings default \
            DEWZX_VOICE_AI/

      - name: Generate flash info & merged binary
        run: |
          cd build

          # Rename agar lebih mudah dibaca
          cp DEWZX_VOICE_AI.ino.bootloader.bin  bootloader.bin   || true
          cp DEWZX_VOICE_AI.ino.partitions.bin  partitions.bin   || true
          cp DEWZX_VOICE_AI.ino.bin              firmware.bin     || true

          # Buat merged binary (1 file, flash ke 0x0)
          esptool.py --chip esp32s3 merge_bin \
            -o merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0     bootloader.bin \
            0x8000  partitions.bin \
            0x10000 firmware.bin  || echo "merge_bin skip (esptool not found)"

          # Buat file petunjuk flash
          cat > CARA_FLASH.txt << 'EOF'
          ════════════════════════════════════════
           DEWZX VOICE AI — Panduan Flash
          ════════════════════════════════════════

          PILIHAN 1 — Flash 3 file terpisah (LEBIH STABIL, pakai ini)
          ─────────────────────────────────────────
          File              Alamat
          bootloader.bin    0x0000
          partitions.bin    0x8000
          firmware.bin      0x10000

          PILIHAN 2 — Flash 1 file sekaligus
          ─────────────────────────────────────────
          File              Alamat
          merged.bin        0x0000

          CATATAN:
          - Chip: ESP32-S3, Flash 16MB, PSRAM 8MB OPI
          - Baud rate saat flash: pakai 115200 jika sering gagal
          - Pastikan ESP32-S3 dalam mode bootloader (tekan BOOT lalu RESET)
          EOF

          ls -lh *.bin CARA_FLASH.txt

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEWZX-firmware-${{ github.sha }}
          path: |
            build/bootloader.bin
            build/partitions.bin
            build/firmware.bin
            build/merged.bin
            build/CARA_FLASH.txt
          retention-days: 30

